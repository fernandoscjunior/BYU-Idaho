<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-COMPATIBLE" content="IE=edge">
    <meta name="description" content="Tic-Tac-Toe">
    <meta name="author" content="Fernando S. Costa Jr">
    <title>Tic Tac and Toe</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/desktop.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script defer src="js/tic-tac-toe.js"></script>
</head>
<body>
    <main>
        <h1>Tic Tac Toe</h1>
        <h2 class="net-stat"></h2>
        <div class="msg-div hide">
            <p id="msg"></p>
            <button id="new-btn">New Game</button>
        </div>
        <section class="play-board" id="board">
            <button class="box" id="1"> </button>
            <button class="box" id="2"> </button>
            <button class="box" id="3"> </button>
            <button class="box" id="4"> </button>
            <button class="box" id="5"> </button>
            <button class="box" id="6"> </button>
            <button class="box" id="7"> </button>
            <button class="box" id="8"> </button>
            <button class="box" id="9"> </button>
        </section>
    </main>
</body>
</html>
